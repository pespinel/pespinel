name: Metrics

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Overview
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: pespinel
          filename: metrics/overview.svg
          output_action: none
          template: classic
          base: header, activity, community
          base_indepth: yes
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          repositories_affiliations: owner, collaborator, organization_member
          repositories: 400
          repositories_batch: 50
          config_timezone: Europe/Madrid

      - name: Commit calendar and streak
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: pespinel
          filename: metrics/isocalendar.svg
          output_action: none
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: Europe/Madrid

      - name: Publish renders to assets branch
        run: |
          set -euo pipefail
          ls -la /metrics_renders/metrics/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B assets
          mkdir -p metrics
          cp /metrics_renders/metrics/*.svg metrics/
          git add -f metrics
          git commit -m "chore: update profile metrics"
          git push -f origin assets
